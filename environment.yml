name: glacier_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - rdkit=2025.09.3
  - joblib
  - scikit-learn
  - pip:
    - torch==2.5.1
    - lightning==2.4.0
    - pytorch-lightning==2.4.0
    - torchmetrics==1.6.0
    - transformers
    - huggingface-hub
    - chemprop==2.2.1
    - matplotlib
    - seaborn
    - tqdm